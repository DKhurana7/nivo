# The app, worker and Ollama run natively. This profile supplies local LiveKit.
services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ['--config', '/etc/livekit.yaml', '--node-ip', '127.0.0.1']
    volumes:
      - ./deploy/generated/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '127.0.0.1:7880:7880'
      - '127.0.0.1:7881:7881'
      - '127.0.0.1:7882:7882/udp'
    restart: unless-stopped
